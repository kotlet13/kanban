name: familyhub-crypto-database-tests
services:
  database:
    image: ${FAMILYHUB_CRYPTO_DATABASE_IMAGE:-mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2}
    environment:
      MYSQL_DATABASE: kanboard
      MYSQL_USER: familyhub_dev
      MYSQL_PASSWORD: familyhub-development-only
      MYSQL_ROOT_PASSWORD: familyhub-root-development-only
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost --silent || mysqladmin ping -h localhost --silent"]
      interval: 2s
      timeout: 3s
      retries: 40
    restart: "no"
  app:
    image: familyhub-crypto-tests:local
    depends_on:
      database:
        condition: service_healthy
    environment:
      FAMILYHUB_CRYPTO_TEST_MYSQL: "1"
    volumes:
      - app-data:/var/www/app/data
      - ./plugins/FamilyHub:/var/www/app/plugins/FamilyHub:ro
      - ./dev-mysql-config.php:/familyhub-mysql-config.php:ro
      - ./crypto-test-config.php:/var/www/app/config.php:ro
      - ./tests:/familyhub-tests:ro
    restart: "no"
volumes:
  database-data:
  app-data:
