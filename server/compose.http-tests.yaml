# Independent synthetic HTTP fixtures. Keep the browser development data separate.
name: kanban-familyhub-http-tests
services:
  sharing:
    image: kanboard/kanboard:v1.2.54@sha256:8df6c4339134b6c196da9a262daa42ab8ce395f528a48d4a3dd7038c296f34c1
    ports:
      - "127.0.0.1:18381:80"
    volumes:
      - sharing-data:/var/www/app/data
      - ./plugins/FamilyHub:/var/www/app/plugins/FamilyHub:ro
      - ./dev-config.php:/var/www/app/config.php:ro
      - ./tests:/familyhub-tests:ro
    restart: "no"
  upgrade:
    image: kanboard/kanboard:v1.2.54@sha256:8df6c4339134b6c196da9a262daa42ab8ce395f528a48d4a3dd7038c296f34c1
    ports:
      - "127.0.0.1:18382:80"
    volumes:
      - upgrade-data:/var/www/app/data
      - ./plugins/FamilyHub:/var/www/app/plugins/FamilyHub:ro
      - ./dev-config.php:/var/www/app/config.php:ro
      - ./tests:/familyhub-tests:ro
    restart: "no"
volumes:
  sharing-data:
  upgrade-data:
