# Fresh synthetic enrollment/account/private-sync HTTP fixture, separate from 18380.
name: kanban-familyhub-account-tests
services:
  kanboard:
    image: kanboard/kanboard:v1.2.54@sha256:8df6c4339134b6c196da9a262daa42ab8ce395f528a48d4a3dd7038c296f34c1
    ports:
      - "127.0.0.1:${FAMILYHUB_ACCOUNT_TEST_PORT:-18383}:80"
    volumes:
      - account-data:/var/www/app/data
      - ./plugins/FamilyHub:/var/www/app/plugins/FamilyHub:ro
      - ./dev-config.php:/familyhub-dev-config.php:ro
      - ./tests:/familyhub-tests:ro
    restart: "no"
volumes:
  account-data:
