# Optional synthetic compatibility matrix matching the observed backup version.
name: kanban-familyhub-mariadbtest
services:
  database:
    image: mariadb:10.11.19@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    environment:
      MARIADB_DATABASE: kanboard
      MARIADB_USER: familyhub_dev
      MARIADB_PASSWORD: familyhub-development-only
      MARIADB_ROOT_PASSWORD: familyhub-root-development-only
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 60
    restart: "no"
  kanboard:
    image: kanboard/kanboard:v1.2.54@sha256:8df6c4339134b6c196da9a262daa42ab8ce395f528a48d4a3dd7038c296f34c1
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:18382:80"
    volumes:
      - kanboard-data:/var/www/app/data
      - ./plugins/FamilyHub:/var/www/app/plugins/FamilyHub:ro
      - ./dev-mysql-config.php:/var/www/app/config.php:ro
      - ./tests:/familyhub-tests:ro
    restart: "no"
volumes:
  mariadb-data:
  kanboard-data:
